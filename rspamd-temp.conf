# Redis instance for rspamd (greylist, replies, ratelimit, neural, history, ...)
# Data is reconstructible, so no persistence. Unix socket only.
port 0
unixsocket /run/redis/rspamd-temp/redis.sock
unixsocketperm 0660
daemonize no
supervised systemd
save ""
appendonly no
dir /srv/redis/rspamd-temp
maxmemory 64mb
maxmemory-policy allkeys-lru
loglevel notice
protected-mode yes
